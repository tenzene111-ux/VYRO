name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/vyro-social-network-design-defslc
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Supabase's anon/publishable key is designed to be public (it's
          # gated by row-level security, not secrecy), so it's safe to bake
          # into the deployed build here rather than needing a GitHub secret.
          VITE_SUPABASE_URL: https://cdynswgpcvvsnggmffpc.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_XC9SbewzNX084LfE3_b3mQ__s1BlS9r
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
